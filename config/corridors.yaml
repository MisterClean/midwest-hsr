# Midwest high-speed and intercity rail corridors under serious consideration.
#
# tier:
#   hsr      - dedicated high-speed backbone (150-220 mph) proposed by the High Speed
#              Rail Alliance (HSRA), the FRA/MIPRC Midwest Regional Rail Plan (2021)
#              or a state commission.
#   regional - conventional / higher-speed (79-125 mph) corridors in the FRA Corridor
#              ID program or the Midwest Regional Rail Plan that feed the backbone.
# speed_label: compact top-speed tag for the map's departure board.
# follow:
#   rail     - route on the existing rail network between waypoints (NTAD NARN, or
#              Natural Earth as a fallback). Used where a plan names an existing line.
#   direct   - conceptual alignment: straight segments through waypoints (and `via`
#              shaping points). Used for greenfield / interstate-ROW options whose
#              alignments are not yet published as GIS.
# waypoints: station ids from stations.yaml in travel order. A leading "~" marks a
#   pass-through shaping point (the line goes by it but the plan names no stop there).
# option_group / option: alternatives for one market; exactly one option per group
#   is `default: true` and feeds network-wide totals. The map compares all options.
#
# Every corridor cites the documents its stops and status come from. Nothing here is
# an engineering alignment; see docs/methodology.md for accuracy limits.

sources:
  ilhsr_2025: {title: "Illinois High-Speed Rail Commission, 2025 Annual Report", url: "https://idot.illinois.gov/content/dam/soi/en/web/idot/documents/programs-and-projects/rail-and-freight/hsr/2025-hsr-commision-2025-annualreport-final.pdf"}
  ilhsr_page: {title: "IDOT High-Speed Rail Commission", url: "https://idot.illinois.gov/programs-and-projects/rail-and-freight/high-speed-rail-commission.html"}
  hsra_220: {title: "High Speed Rail Alliance, 220 MPH High Speed Rail in the Midwest", url: "https://www.hsrail.org/220-mph-high-speed-rail-midwest"}
  hsra_midwest: {title: "High Speed Rail Alliance, High Speed Rail in the Midwest", url: "https://www.hsrail.org/midwest/"}
  hsra_mwrrp: {title: "High Speed Rail Alliance, FRA's New Midwest Regional Rail Plan", url: "https://hsrail.org/blog/fras-new-midwest-regional-rail-plan"}
  fra_mwrrp: {title: "FRA, Midwest Regional Rail Plan release (2021)", url: "https://railroads.dot.gov/newsroom/press-releases/federal-railroad-administration-releases-midwest-regional-rail-plan-0"}
  miprc_mwrrp: {title: "MIPRC, FRA & MIPRC release Midwest Regional Rail Plan", url: "https://miprc.org/News/MIPRC-News/fra-miprc-release-midwest-regional-rail-plan-a-40-year-look-ahead-at-what-could-be"}
  fra_cid_2023: {title: "FRA, Corridor ID selections (Dec 8, 2023)", url: "https://railroads.dot.gov/sites/fra.dot.gov/files/2023-12/FRA%2013-23.pdf"}
  miprc_cid: {title: "MIPRC, Midwestern states get big wins in Corridor ID", url: "https://miprc.org/News/News-From-MIPRC-States/midwestern-states-get-big-wins-in-federal-corridor-id-development-programs-inaugural-round"}
  aao_cid: {title: "All Aboard Ohio, Big changes to the federal passenger rail funding program", url: "https://www.allaboardohio.org/posts/federal-passenger-rail-funding-program-updates"}
  wiki_hub: {title: "Wikipedia, Chicago Hub Network (SNCF 2009 / MHSRA 2009 routes)", url: "https://en.wikipedia.org/wiki/Chicago_Hub_Network"}
  fw_connect: {title: "City of Fort Wayne, Midwest Connect Corridor ID", url: "https://engage.cityoffortwayne.org/midwest-connect-passenger-rail-corridor-identification-development"}

