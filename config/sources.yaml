# Every external input the pipeline touches, with the authoritative URL first
# and any fallback mirror second. `hsr fetch` tries sources in order and records
# which one it used (plus a SHA-256 of the file) in data/raw/MANIFEST.json.

boundaries:
  # Full-resolution, state-filtered GeoJSON from the current TIGERweb legislative
  # service. Missouri's 120th layer still shows the superseded 2025 plan, so use
  # the 119th layer there until Census regenerates the 120th products.
  tigerweb:
    base: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Legislative/MapServer
    layers: {congress: 0, state_senate: 1, state_house: 2}
    missouri_congress_layer: 4
    vintage: 2026
  # Cartographic state/county context and district fallback for --mirror.
  # Normal district builds use the full-resolution TIGERweb GeoJSON above.
  vintage: 2024
  congress:
    layer: cd119
    urls:
      - https://www2.census.gov/geo/tiger/GENZ{year}/shp/cb_{year}_us_cd119_500k.zip
  state_senate:
    layer: sldu
    urls:
      - https://www2.census.gov/geo/tiger/GENZ{year}/shp/cb_{year}_us_sldu_500k.zip
  state_house:
    layer: sldl
    urls:
      - https://www2.census.gov/geo/tiger/GENZ{year}/shp/cb_{year}_us_sldl_500k.zip
  states:
    urls:
      - https://www2.census.gov/geo/tiger/GENZ{year}/shp/cb_{year}_us_state_500k.zip
  counties:
    urls:
      - https://www2.census.gov/geo/tiger/GENZ{year}/shp/cb_{year}_us_county_500k.zip

  # Public GitHub mirror of the 2023 cartographic boundary files (GeoJSON,
  # converted with mapshaper by github.com/lint/CartoBoundaryGeoFiles). Used only
  # when census.gov is unreachable. Its legislative layers are LSY 2022, so the
  # states listed under `vintage_caveats` are flagged in every output.
  mirror:
    vintage: 2023
    base: https://raw.githubusercontent.com/lint/CartoBoundaryGeoFiles/c8331b6ddad3b2762c2c3c89433b7067c53ab383/data/cb_2023_us_all_500k
    files:
      congress: cb_2023_us_cd118_500k.geojson
      state_senate: cb_2023_us_sldu_500k.geojson
      state_house: cb_2023_us_sldl_500k.geojson
      states: cb_2023_us_state_500k.geojson
      counties: cb_2023_us_county_500k.geojson
      block_groups: cb_2023_us_bg_500k_0.045.geojson  # 2020 block groups, simplified to fit GitHub

# Older mirror district builds can use official local plan overrides. Each
# override is resolved with the best input available, in this order:
#   1. `path`      official plan geometry (zip/shp/geojson, one feature per district)
#   2. `baf_path`  the plan's block assignment file (zip containing an .xlsx/.csv, or
#                  the .xlsx/.csv itself). `hsr fetch` downloads it from `baf_url`.
#                  Dissolved on 2020 census blocks from `blocks_url` (exact) or, if
#                  those are unreachable, on 2020 block groups from the mirror
#                  (approximate only where a district line cuts a block group).
#   3. `composition` official county list: whole counties are exact, split counties
#                  are drawn as "split between X and Y" and kept out of counts.
overrides:
  - state: OH
    office: us_house
    reason: >-
      Ohio Redistricting Commission adopted a new congressional map on
      2025-10-31 (plan 430); it was used for the 2026 election.
    path: data/overrides/oh_congress_2026.zip
    district_field: DISTRICT
    baf_url: https://redistricting.ohio.gov/api/public/districtmaps/430/download
    baf_path: data/overrides/oh_cong_2025_plan430.zip
    blocks_url: https://www2.census.gov/geo/tiger/TIGER2020/TABBLOCK20/tl_2020_39_tabblock20.zip
    composition: config/ohio_cd_2026_counties.yaml

# Caveats applied when a layer comes from an older vintage than the 2026 lines.
vintage_caveats:
  2023:
    state_senate:
      WI: Wisconsin enacted new legislative maps in Feb 2024 (used 2024 and 2026).
      OH: Ohio adopted new legislative maps in Sept 2023 (used 2024 and 2026).
      MI: Detroit-area Senate districts were redrawn (Agee v. Benson) for 2026.
    state_house:
      WI: Wisconsin enacted new legislative maps in Feb 2024 (used 2024 and 2026).
      OH: Ohio adopted new legislative maps in Sept 2023 (used 2024 and 2026).
      MI: Detroit-area House districts were redrawn (Agee v. Benson) for 2024.
  2024:
    state_senate:
      MI: Detroit-area Senate districts redrawn for 2026 may post-date this vintage; verify LSY.

rosters:
  # Sitting members going into the election; used for seats not on the 2026 ballot
  # and as the "before" side of every flip calculation. Pin the commit you used.
  congress_legislators:
    repo: https://github.com/unitedstates/congress-legislators
    file: legislators-current.yaml
  openstates_people:
    repo: https://github.com/openstates/people
    path: data/{state}/legislature

rail:
  # BTS National Transportation Atlas Database (NTAD), ArcGIS FeatureServer.
  narn_lines:
    url: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_North_American_Rail_Network_Lines/FeatureServer/0
  amtrak_stations:
    url: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_Amtrak_Stations/FeatureServer/0
  # Fallback network for routing when NTAD is unreachable (coarser, ~1-2 km).
  natural_earth_railroads:
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_railroads.geojson
  natural_earth_lakes:
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_lakes.geojson

results:
  # 2026 results are unofficial until each state certifies (late Nov - Dec 2026).
  # The snapshot directory holds what was published on/after election night with
  # per-row source URLs. Swap in certified returns with the adapters in
  # src/hsr/results.py (MEDSL / OpenElections formats) once they are released.
  snapshot: data/snapshots/2026-11-06
